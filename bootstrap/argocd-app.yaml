apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: poc-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/atul-devops-lab/POC-application-gitops.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: poc-application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
