apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    chart: external-secrets
    repoURL: https://charts.external-secrets.io
    targetRevision: 0.10.5
    helm:
      releaseName: external-secrets
      valuesObject:
        serviceAccount:
          name: external-secrets
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::595981035245:role/atul-devops-lab-eks-external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
