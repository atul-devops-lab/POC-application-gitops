apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default

  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 90.0.0

    helm:
      releaseName: monitoring

      valuesObject:
        grafana:
          enabled: true
          # Instructs Grafana to authenticate using the AWS Secrets Manager secret synced by ESO instead of Helm's default auto-generated secret
          admin:
            existingSecret: "monitoring-grafana-admin"
            passwordKey: "admin-password"

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
