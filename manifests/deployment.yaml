apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-application
  namespace: poc-application
  labels:
    app: poc-application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: poc-application
  template:
    metadata:
      labels:
        app: poc-application
    spec:
      containers:
        - name: poc-application
          image: 595981035245.dkr.ecr.ap-south-1.amazonaws.com/atul-devops-lab/poc-application:703b92a06cf69ff097276f37a8fa777054156f0c
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
